# Checks that the generated manual pages (manual/*.html) match their sources: manual/chapters/,
# manual/navigation.json and manual/templates/page.html. Rebuild with: python3 manual/build.py
name: Manual

on:
  push:
    branches: [main]
    paths: ["manual/**", ".github/workflows/manual.yml"]
  pull_request:
    paths: ["manual/**", ".github/workflows/manual.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  up-to-date:
    name: Generated pages match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Rebuild the manual
        run: python3 manual/build.py
      - name: No generated page differs
        run: git diff --exit-code manual/
      - name: No generated page is missing or left over
        run: |
          untracked="$(git status --porcelain --untracked-files=all manual/)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "Commit the pages that manual/build.py generates."
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib, sys
          manual = pathlib.Path("manual")
          slugs = {c["slug"] for c in json.loads((manual / "navigation.json").read_text())["chapters"]}
          extra = sorted(p.name for p in manual.glob("*.html") if p.stem not in slugs)
          if extra:
              sys.exit("pages with no chapter in manual/navigation.json: " + ", ".join(extra))
          PY
