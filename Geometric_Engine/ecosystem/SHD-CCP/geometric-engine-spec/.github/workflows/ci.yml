# TEMPLATE for after this folder is split into its own repository (Geometric_Engine/ecosystem/README.md).
# GitHub runs only the workflows at the root of a repository, so this file does not run while the
# folder is staged inside SHD-CCP. Meanwhile SHD-CCP's .github/workflows/ecosystem-conformance.yml
# runs its checks.

name: spec

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  vectors:
    name: Validate golden vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate every suite against schema.json
        run: |
          python - <<'PY'
          import json, pathlib, jsonschema
          d = pathlib.Path("test_vectors")
          schema = json.loads((d / "schema.json").read_text())
          for p in sorted(d.glob("*.json")):
              if p.name != "schema.json":
                  jsonschema.validate(json.loads(p.read_text()), schema)
                  print("ok", p.name)
          PY
      - name: Vectors match the reference generator
        run: |
          git clone --depth 1 https://github.com/SHD-CCP/geometric-engine ../geometric-engine
          python ../geometric-engine/verification/export_golden_vectors.py --check --out test_vectors

  lean:
    name: Lean 4 proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: formal/lean4
      - name: No sorry
        run: "! grep -rn --include='*.lean' -w sorry formal/lean4/GeometricEngineSpec"
