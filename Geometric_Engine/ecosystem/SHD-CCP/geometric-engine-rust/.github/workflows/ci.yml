# TEMPLATE for after this folder is split into its own repository (Geometric_Engine/ecosystem/README.md).
# GitHub runs only the workflows at the root of a repository, so this file does not run while the
# folder is staged inside SHD-CCP. Meanwhile SHD-CCP's .github/workflows/ecosystem-conformance.yml
# runs its checks.

name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo test
      - name: no_std build
        run: cargo build --no-default-features --target wasm32-unknown-unknown
