# TEMPLATE for after this folder is split into its own repository (Geometric_Engine/ecosystem/README.md).
# GitHub runs only the workflows at the root of a repository, so this file does not run while the
# folder is staged inside SHD-CCP. Meanwhile SHD-CCP's .github/workflows/ecosystem-conformance.yml
# runs its checks.

name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
